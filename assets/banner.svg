<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-amber" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>
    
    <!-- Accent Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .name-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
    .role-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #38bdf8; letter-spacing: 0.5px; }
    .metric-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .metric-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #94a3b8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#glow-cyan)" />
  <rect width="100%" height="100%" fill="url(#glow-amber)" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="100%" height="4" fill="url(#line-grad)" rx="2" />

  <!-- Content Group -->
  <g transform="translate(60, 45)">
    <!-- Terminal prompt badge -->
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="12" cy="13" r="4" fill="#38bdf8" />
    <text x="24" y="17" class="tag-text mono" fill="#38bdf8" font-size="11">ENGINEERING PORTFOLIO</text>

    <!-- Main Name -->
    <text x="0" y="68" class="name-title">Ronald Solares Chuquera</text>

    <!-- Role -->
    <text x="0" y="100" class="role-subtitle">Industrial Civil Engineer · Data &amp; Business Analytics</text>

    <!-- Horizontal divider line -->
    <line x1="0" y1="120" x2="650" y2="120" stroke="#334155" stroke-width="1" stroke-opacity="0.8" />

    <!-- Badges / Domain Highlights -->
    <g transform="translate(0, 138)">
      <!-- Badge 1: Management Control & BI -->
      <g transform="translate(0, 0)">
        <rect width="210" height="32" rx="6" fill="url(#pill-grad)" stroke="#475569" stroke-width="0.8" />
        <circle cx="16" cy="16" r="3.5" fill="#f59e0b" />
        <text x="30" y="20" class="tag-text">Management Control &amp; BI</text>
      </g>

      <!-- Badge 2: Data & Lakehouse Eng -->
      <g transform="translate(222, 0)">
        <rect width="215" height="32" rx="6" fill="url(#pill-grad)" stroke="#475569" stroke-width="0.8" />
        <circle cx="16" cy="16" r="3.5" fill="#38bdf8" />
        <text x="30" y="20" class="tag-text">Data &amp; Lakehouse Pipelines</text>
      </g>

      <!-- Badge 3: Quantitative Modeling -->
      <g transform="translate(449, 0)">
        <rect width="210" height="32" rx="6" fill="url(#pill-grad)" stroke="#475569" stroke-width="0.8" />
        <circle cx="16" cy="16" r="3.5" fill="#10b981" />
        <text x="30" y="20" class="tag-text">Quantitative Modeling &amp; OR</text>
      </g>
    </g>

    <!-- Academic & Rigor Banner -->
    <g transform="translate(0, 192)">
      <rect width="660" height="36" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="16" y="22" class="metric-text">
        <tspan fill="#38bdf8">🎓 Academic Distinction:</tspan> 
        <tspan fill="#f8fafc"> Rank 5 of 79 (Top 6%)</tspan> 
        <tspan fill="#64748b"> · </tspan>
        <tspan fill="#cbd5e1">12 Semesters completed in 5.5 Years with Zero Delays</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side: Tech & Architecture Matrix Card -->
  <g transform="translate(775, 45)">
    <rect width="365" height="230" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1" stroke-opacity="0.8" />
    
    <!-- Header of right card -->
    <rect x="0" y="0" width="365" height="36" rx="12" fill="#1e293b" fill-opacity="0.6" />
    <circle cx="20" cy="18" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4" fill="#f59e0b" opacity="0.8" />
    <circle cx="48" cy="18" r="4" fill="#10b981" opacity="0.8" />
    <text x="66" y="22" class="tag-text mono" fill="#94a3b8" font-size="11">system_manifest.yaml</text>

    <!-- Stack items -->
    <g transform="translate(20, 56)">
      <text x="0" y="15" class="mono" font-size="12" fill="#64748b">core_languages:</text>
      <text x="140" y="15" class="mono" font-size="12" font-weight="bold" fill="#38bdf8">Python, SQL, VBA</text>

      <text x="0" y="42" class="mono" font-size="12" fill="#64748b">data_engine:</text>
      <text x="140" y="42" class="mono" font-size="12" font-weight="bold" fill="#f8fafc">Delta Lake, DuckDB, Polars</text>

      <text x="0" y="69" class="mono" font-size="12" fill="#64748b">bi_and_fin:</text>
      <text x="140" y="69" class="mono" font-size="12" font-weight="bold" fill="#f59e0b">Power BI (DAX), SAP ERP</text>

      <text x="0" y="96" class="mono" font-size="12" fill="#64748b">streaming_iot:</text>
      <text x="140" y="96" class="mono" font-size="12" font-weight="bold" fill="#34d399">Redpanda, Uber H3, CEP</text>

      <text x="0" y="123" class="mono" font-size="12" fill="#64748b">methodology:</text>
      <text x="140" y="123" class="mono" font-size="12" font-weight="bold" fill="#a78bfa">Clean Arch, TDD (Pytest)</text>

      <!-- Bottom verification badge -->
      <g transform="translate(0, 142)">
        <rect width="325" height="24" rx="4" fill="#1e293b" />
        <text x="10" y="16" class="mono" font-size="11" fill="#38bdf8">✓ 100% Deterministic &amp; Unit Tested</text>
      </g>
    </g>
  </g>
</svg>
